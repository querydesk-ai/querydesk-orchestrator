[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querydesk-orchestrator"
version = "0.3.0"
description = "QueryDesk orchestrator — hybrid RAG and SR routing for an internal AI service desk"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "httpx==0.27.2",
  # Vector search. fastembed supplies the CPU BM25 sparse vectors.
  "qdrant-client==1.19.1",
  "fastembed==0.5.1",
  # Used from PRD Day 6 onward (Redis slot-filling, Postgres orchestrator tables).
  "redis==8.1.0",
  "asyncpg==0.31.0",
  # Day 7: webhook notify task + reconciliation beat. No [redis] extra: it caps
  # redis-py below the 8.x pinned above; kombu imports redis-py directly.
  "celery==5.6.3",
  # WhatsApp: Twilio posts each inbound message as a form.
  "python-multipart==0.0.32",
]

# Dev tooling. `uv sync` installs this group by default; uv.lock pins the full tree.
[dependency-groups]
dev = [
  # fakeredis stands in for Redis (query cache, later slot-filling state).
  "fakeredis==2.40.0",
  "pytest==9.1.1",
  # respx mocks the Fireworks HTTP API so the suite runs with no credentials.
  "respx==0.21.1",
  "ruff==0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# The Day 8 chat page ships inside the package.
[tool.setuptools.package-data]
querydesk = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ layout: importable without `pip install -e .` (CI, fresh checkouts).
pythonpath = ["src"]
# Integration tests still run offline — they drive the ASGI app in-process.
# Anything needing live credentials belongs in scripts/, not tests/.
markers = [
  "anyio: run an async test on the anyio backend",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
