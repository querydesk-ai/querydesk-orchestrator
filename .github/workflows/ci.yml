name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python version comes from .python-version; deps from uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # No secrets configured: the suite mocks Fireworks with respx and
      # monkeypatches Qdrant, so it must pass with no credentials at all.
      # If a test ever needs a key, that test belongs outside tests/.
      - name: Run tests
        run: uv run pytest -q

  # A broken Dockerfile fails the PR. Both targets: the stand-in builds on runtime.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the runtime image
        run: docker build --target runtime -t querydesk-orchestrator .

      - name: Build the stand-in image
        run: docker build --target stand-in -t querydesk-stand-in .

      # The image starts and imports the app with no credentials, and the BM25
      # model is already in it (HF_HUB_OFFLINE fails a download attempt).
      - name: Smoke-test the image
        run: >
          docker run --rm -e HF_HUB_OFFLINE=1 querydesk-orchestrator
          python -c "import querydesk.main; from querydesk.services.retrieval import sparse;
          sparse.sparse_embed_query('restart the claims app'); print('ok')"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0

      # Org-owned repos need a GITLEAKS_LICENSE secret: a free key from
      # gitleaks.io, added under Settings → Secrets and variables → Actions.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
