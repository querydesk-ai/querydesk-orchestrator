name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python version comes from .python-version; deps from uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # No secrets configured: the suite mocks Fireworks with respx and
      # monkeypatches Qdrant, so it must pass with no credentials at all.
      # If a test ever needs a key, that test belongs outside tests/.
      - name: Run tests
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0

      # The gitleaks CLI directly, not gitleaks/gitleaks-action: the action
      # requires a paid licence for organisation-owned repos, the CLI is MIT.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Scan for leaked secrets
        run: ./gitleaks git --redact --verbose .
